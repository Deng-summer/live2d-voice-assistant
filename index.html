        <script type="module" >
            import { triggerRepeatMotion,triggerMotion,triggerExpression } from './js/live2d-cubism4.js'
            import { control_mode } from './js/jinhua/control.js'

            document.addEventListener('DOMContentLoaded', function () {
                // const myAudio = document.getElementById('my_audio');
                const musicAudio = document.getElementById('music_audio');
                const stationAudio = document.getElementById('station_audio');

                
                // addListeners(myAudio);
                addMusicListeners(musicAudio);
                addListeners(stationAudio);

                // 检查是否有音频正在播放
                function checkAudioPlaying() {
                    if(control_mode!== 'BUS'){
                        return
                    }
                    const isAnyAudioPlaying = [stationAudio].some(audio => !audio.paused);
                    
                    console.log('触发 Audio Playing',isAnyAudioPlaying)
                    if (isAnyAudioPlaying) {
                        triggerRepeatMotion('Talk');
                    } else {
                        triggerMotion('Idle')
                    }

                }

                function checkMusicPlaying(){
                    const isAnyAudioPlaying = [musicAudio].some(audio => !audio.paused);
                    console.log('触发 music Playing',isAnyAudioPlaying)
                    if (isAnyAudioPlaying) {
                        triggerRepeatMotion('Song');
                    } else {
                        triggerMotion('Idle');
                    }
                }


                function addListeners(audioElement) {
                    audioElement.addEventListener('play', checkAudioPlaying);
                    audioElement.addEventListener('pause', checkAudioPlaying);
                }

                function addMusicListeners(audioElement){
                    audioElement.addEventListener('play', checkMusicPlaying);
                    audioElement.addEventListener('pause', checkMusicPlaying);
                }
            });
        
            window.onload = function() {
                document.body.focus(); 
            };

        </script>
