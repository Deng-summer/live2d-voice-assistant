server {
     #SSL 默认访问端口号为 443
     listen 443 ssl; 
     #请填写绑定证书的域名
     server_name avatar.chekkk.com; 
     #请填写证书文件的相对路径或绝对路径
     ssl_certificate /etc/nginx/ssl_key/Nginx/FullSSL.crt; 
     #请填写私钥文件的相对路径或绝对路径
     ssl_certificate_key /etc/nginx/ssl_key/Nginx/SSL.key; 
     ssl_session_timeout 5m;
     #请按照以下协议配置
     ssl_protocols TLSv1.2 TLSv1.3; 
     #请按照以下套件配置，配置加密套件，写法遵循 openssl 标准。
     ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE; 
     ssl_prefer_server_ciphers on;
     location /0001 {
         #网站主页路径。此路径仅供参考，具体请您按照实际目录操作。
         #例如，您的网站主页在 Nginx 服务器的 /etc/www 目录下，则请修改 root 后面的 html 为 /etc/www。
     	 # 金华小巴    
         root /chekkk/code/live2d; 
         index  index.html index.htm;
      	 client_max_body_size 64M;

	 # 禁用缓存
         add_header Cache-Control "no-cache, no-store, must-revalidate";
         add_header Pragma "no-cache";
         add_header Expires 0;
         expires off;
     }

     location /jinhua {
         #网站主页路径。此路径仅供参考，具体请您按照实际目录操作。
         #例如，您的网站主页在 Nginx 服务器的 /etc/www 目录下，则请修改 root 后>面的 html 为 /etc/www。
         # 金华小巴
         root /chekkk/code/live2d;
         index  index.html index.htm;
         client_max_body_size 64M;

	 # 禁用缓存
    	 add_header Cache-Control "no-cache, no-store, must-revalidate";
    	 add_header Pragma "no-cache";
    	 add_header Expires 0;
    	 expires off;
     }

     location /0002 {
	 # 说车直播
         #网站主页路径。此路径仅供参考，具体请您按照实际目录操作。
         #例如，您的网站主页在 Nginx 服务器的 /etc/www 目录下，则请修改 root 后>面的 html 为 /etc/www。
         root  /chekkk/code/live2d;
         index  index.html index.htm;
         client_max_body_size 64M;
	 # 禁用缓存
    	 add_header Cache-Control "no-cache, no-store, must-revalidate";
    	 add_header Pragma "no-cache";
    	 add_header Expires 0;
    	 expires off;

     }

     location /0003 {
         # 青创北京潮购会
         #网站主页路径。此路径仅供参考，具体请您按照实际目录操作。
         #例如，您的网站主页在 Nginx 服务器的 /etc/www 目录下，则请修改 root 后>面的 html 为 /etc/www。

         root /chekkk/code/live2d;
         index  index.html index.htm;
         client_max_body_size 64M;

	 # 禁用缓存
    	 add_header Cache-Control "no-cache, no-store, must-revalidate";
    	 add_header Pragma "no-cache";
    	 add_header Expires 0;
    	 expires off;
     }
   
     location /js {
         # js
         alias /chekkk/code/live2d/0001/js;
     }

     location /css {
         # css
         alias /chekkk/code/live2d/0001/css;
     }

     location /model {
         # css
         alias /chekkk/code/live2d/0001/model;
     }

   location /ai/ {
	proxy_pass http://1.95.87.50:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
   }

   location /ai_0001/ {
        proxy_pass http://1.95.87.50:9002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
   }

   location /ai_0003/ {
        proxy_pass http://1.95.87.50:9003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
   }

   location /AI/ {
        proxy_pass http://1.95.87.72:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
   }

   # ==================== 豆包 API 转发配置 ====================

   # 豆包 Token API 转发（直接转发到豆包 API，无需 Node 服务）
   location /api/doubao/token {
        # CORS 预检请求处理
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # 直接转发到豆包 API（不再依赖 Node.js token-server）
        proxy_pass https://openspeech.bytedance.com/api/v1/sts/token;

        # 改为 POST 方法（豆包 API 要求）
        proxy_method POST;

        # 设置请求体（包含 APP_KEY 和 Token 有效期）
        # ⚠️ 重要：这里已经使用了你的实际凭证
        proxy_set_body '{"appid":"3100553971","duration":3600}';

        # 设置请求头
        proxy_set_header Content-Type "application/json";

        # 设置 Authorization（包含 ACCESS_KEY）
        # ⚠️ 重要：这里已经使用了你的实际凭证
        proxy_set_header Authorization "Bearer; ildZ234LgPJyCmi9ns9wpfhIvRmo26ja";

        # 标准代理头
        proxy_set_header Host openspeech.bytedance.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSL 配置
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # 超时配置
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # CORS 配置（允许前端跨域访问）
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

        # 禁用缓存（确保获取最新 Token）
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # 错误处理
        proxy_intercept_errors on;

        # 日志
        access_log /var/log/nginx/doubao_token_access.log;
        error_log /var/log/nginx/doubao_token_error.log;
   }

   # 豆包 WebSocket API 转发（用于语音识别）
   location /api/doubao/ws {
        # 转发到豆包 WebSocket API
        proxy_pass https://openspeech.bytedance.com;

        # WebSocket 升级配置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 代理请求头
        proxy_set_header Host openspeech.bytedance.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 保留原始请求头和查询参数
        proxy_pass_request_headers on;

        # WebSocket 超时配置（长连接）
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # 禁用缓冲（WebSocket 需要）
        proxy_buffering off;

        # 日志
        access_log /var/log/nginx/doubao_ws_access.log;
        error_log /var/log/nginx/doubao_ws_error.log;
   }

   # 健康检查端点
   location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
   }

 }