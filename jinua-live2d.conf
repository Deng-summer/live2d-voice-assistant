server {
     #SSL 默认访问端口号为 443
     listen 443 ssl; 
     #请填写绑定证书的域名
     server_name avatar.chekkk.com; 
     #请填写证书文件的相对路径或绝对路径
     ssl_certificate /etc/nginx/ssl_key/Nginx/FullSSL.crt; 
     #请填写私钥文件的相对路径或绝对路径
     ssl_certificate_key /etc/nginx/ssl_key/Nginx/SSL.key; 
     ssl_session_timeout 5m;
     #请按照以下协议配置
     ssl_protocols TLSv1.2 TLSv1.3; 
     #请按照以下套件配置，配置加密套件，写法遵循 openssl 标准。
     ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE; 
     ssl_prefer_server_ciphers on;
     location /0001 {
         #网站主页路径。此路径仅供参考，具体请您按照实际目录操作。
         #例如，您的网站主页在 Nginx 服务器的 /etc/www 目录下，则请修改 root 后面的 html 为 /etc/www。
     	 # 金华小巴    
         root /chekkk/code/live2d; 
         index  index.html index.htm;
      	 client_max_body_size 64M;

	 # 禁用缓存
         add_header Cache-Control "no-cache, no-store, must-revalidate";
         add_header Pragma "no-cache";
         add_header Expires 0;
         expires off;
     }

     location /jinhua {
         #网站主页路径。此路径仅供参考，具体请您按照实际目录操作。
         #例如，您的网站主页在 Nginx 服务器的 /etc/www 目录下，则请修改 root 后>面的 html 为 /etc/www。
         # 金华小巴
         root /chekkk/code/live2d;
         index  index.html index.htm;
         client_max_body_size 64M;

	 # 禁用缓存
    	 add_header Cache-Control "no-cache, no-store, must-revalidate";
    	 add_header Pragma "no-cache";
    	 add_header Expires 0;
    	 expires off;
     }

     location /0002 {
	 # 说车直播
         #网站主页路径。此路径仅供参考，具体请您按照实际目录操作。
         #例如，您的网站主页在 Nginx 服务器的 /etc/www 目录下，则请修改 root 后>面的 html 为 /etc/www。
         root  /chekkk/code/live2d;
         index  index.html index.htm;
         client_max_body_size 64M;
	 # 禁用缓存
    	 add_header Cache-Control "no-cache, no-store, must-revalidate";
    	 add_header Pragma "no-cache";
    	 add_header Expires 0;
    	 expires off;

     }

     location /0003 {
         # 青创北京潮购会
         #网站主页路径。此路径仅供参考，具体请您按照实际目录操作。
         #例如，您的网站主页在 Nginx 服务器的 /etc/www 目录下，则请修改 root 后>面的 html 为 /etc/www。

         root /chekkk/code/live2d;
         index  index.html index.htm;
         client_max_body_size 64M;

	 # 禁用缓存
    	 add_header Cache-Control "no-cache, no-store, must-revalidate";
    	 add_header Pragma "no-cache";
    	 add_header Expires 0;
    	 expires off;
     }
   
     location /js {
         # js
         alias /chekkk/code/live2d/0001/js;
     }

     location /css {
         # css
         alias /chekkk/code/live2d/0001/css;
     }

     location /model {
         # css
         alias /chekkk/code/live2d/0001/model;
     }

   location /ai/ {
	proxy_pass http://1.95.87.50:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
   }

   location /ai_0001/ {
        proxy_pass http://1.95.87.50:9002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
   }

   location /ai_0003/ {
        proxy_pass http://1.95.87.50:9003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
   }

   location /AI/ {
        proxy_pass http://1.95.87.72:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
   }

 }