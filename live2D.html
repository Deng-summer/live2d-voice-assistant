<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
            <title>Live2D SampleApp1</title>
        </meta>
        
        <meta name="viewport" content="width=device-width, initial-scale=0.5, minimum-scale=1.0, maximum-scale=4.0">
        </meta>
        <link rel="stylesheet" type="text/css" href="css/page.css?v=1.4.2"/>
        <style></style>
    </head>
    <script src="./js/jquery.min.js"></script>
    <script src="./js/waifu-eye.js"></script>
    <script src="./js/face-api.min.js"></script>
    <script src="./js/face-detector.js"></script>
    <script src="./js/websocket.js"></script>
    <!-- Live2D Library -->
    <script src="js/live2d.min.js"></script>
    <script src="js/LAppDefine.js"></script>
    <body onload="InitLive2D()">
        <div class="live2dpage">
            <div class="page_draw">
                <video
                    id="page_draw-video"
                    muted
                    playsinline
                ></video>
                <canvas id="page_draw-video-canvas"></canvas>
            </div>
            <audio id="my_audio"></audio>
            <p class="btn-p">
                <button id="Change" class="active">Change Model</button>
            </p>
            <p class="btn-p">
                <button id="Change" class="active" onclick="test()">Start Talk</button>
            </p>
            <p class="btn-p">
                <button id="Change" class="active" onclick="connect()">Connect Websocket</button>
            </p>
            <p class="btn-p">
                <button id="Change" class="active" onclick="fnOpen()">Face Dectector</button>
            </p>
            <p class="btn-p">
                <button id="Change" class="active" onclick="fnClose()">Face Close</button>
            </p>
            <div class="waifu-tips"></div>
            <div>
                <canvas id="mycanvas" width=600 height=600
                    style="border:dashed 1px #CCC">
                </canvas>
            </div>
        </div>
        <script>
            function test() {
                console.log('test')
                var model = new LAppModel();
                model.startAppointMotion("tap_body",3,2);
            }
            function changeTexure() {
                var model = new LAppModel();
                model.changeTexure(1);
            }

        </script>
    </body>
</html>
