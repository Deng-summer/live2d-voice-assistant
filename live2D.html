<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
            <title>Live2D SampleApp1</title>
        </meta>
        <!-- <meta http-equiv="Content-Security-Policy" content="style-src 'self' 'unsafe-inline';"> -->
        <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'sha256-QIjW/+aUzfg58HcITJNHkkCTGmLovNUIQbL+Zq2TsIE=';"> -->
        <meta name="viewport" content="width=device-width, initial-scale=0.5, minimum-scale=1.0, maximum-scale=4.0">
        </meta>
        <link rel="stylesheet" type="text/css" href="css/page.css?v=1.4.2"/>
        <style></style>
    </head>
    <script src="./js/cdn/axios.min.js"></script>
    <script src="./js/jquery.min.js"></script>

    <!-- live2d sdk2 sdk4版本支持 -->
    <script src="./js/cdn/live2dcubismcore.min.js"></script>
    <script src="./js/cdn/live2d.min.js"></script>
    <script src="./js/cdn/pixi.min.js"></script>
    <script src="./js/cdn/index.min.js"></script>
    <script src="./js/cdn/extra.min.js"></script>
    <script src="./js/live2d-cubism4.js"></script>

    <!-- 眼球追踪控制 -->
    <script src="./js/move-eye.js"></script>
    <script src="./js/face-api.min.js"></script>
    <!-- live2d 配置 -->
    <script src="js/LAppDefine.js"></script>
    <!-- 人脸检测 -->
    <!-- <script src="./js/face-detector.js"></script> -->
    <!-- 处理接收音频 -->
    <script src="js/audioLoad.js"></script> 
    <!-- 处理接收消息-->
    <script src="./js/websocket.js"></script>
    <!-- <script src="./js/live2d.min.js"></script>  -->
    <script src="./js/streamText.js"></script>
    <script src="./js/utils/typeWriter.js"></script>
    <script src="./js/vue@2.js"></script>
    <!-- 引入组件库 -->
    <script src="./js/element-ui.js"></script>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">

    <body>
        <div class="live2dpage" id="live2dpage">
            <div id="listen-desc" style="display: none;">正在听...</div>
            <div class="page_draw">
                <video
                    id="page_draw-video"
                    muted
                ></video>
                <canvas id="page_draw-video-canvas"></canvas>
            </div>
            <audio id="my_audio"></audio>
            <div class="waifu-tips"></div>
            <div>
                <!-- <canvas id="mycanvas" width=800 height=800></canvas> -->
                <canvas id="canvaslive2d4"></canvas>
            </div>
            <div id="control"></div>
            <!-- <div class="black-bg"></div> -->
        </div>
        <div id="app">
            <div class="dialog-sec">
                <div class="dialog-body">
                    <div class="dialog-question"></div>
                    <div class="dialog-answer">
                        <p class="dialog-answer-p"></p>
                    </div>
                </div>
            </div>
        </div>
        <script>
            //切换皮肤
            function changeTexure() {
                var model = new LAppModel();
                model.changeTexure(1);
            }
            const pageElement = document.getElementById('live2dpage'); // 替换成您要触发事件的元素的ID
            // 添加鼠标移动事件监听器
            // document.addEventListener('mousemove', function(event) {
            //     // console.log('位置',event.clientX,event.clientY)
            //     // 当鼠标移动时触发的操作
            // })
            connect()
            // connectAudio()
            live2dMain()
            // document.addEventListener('mousemove', function(event) {
            //     console.log(1)
            //     event.preventDefault();
            // });
            motionTalk(false) 
            // 创建 Vue 实例
            new Vue({
                el: '#app',
                methods: {
                    showEleMessage(message,type,duration = 3000) {
                        return this.$notify({
                            message: message,
                            type: type, //success/warning/info/error	
                            duration:duration
                        });
                    }
                },
                mounted() {
                    // 将方法挂载到 window 对象
                    window.showEleMessage = this.showEleMessage;
                }
            });

        </script>
    </body>
</html>
