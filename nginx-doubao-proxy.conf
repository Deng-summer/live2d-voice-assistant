# =============================================================================
# Nginx 配置：豆包 Token API 代理
# =============================================================================
#
# 用途：直接通过 Nginx 转发豆包 Token 请求，替代不稳定的 Node token-server.js
#
# 使用方法：
# 1. 将此配置添加到你的 nginx.conf 或 sites-available/ 配置中
# 2. 替换 APP_KEY 和 ACCESS_KEY 为你的实际凭证
# 3. 重启 Nginx：sudo nginx -s reload
# 4. 测试：curl http://your-domain/api/doubao/token
#
# =============================================================================

# 豆包 Token 获取接口
# 浏览器访问：/api/doubao/token
location /api/doubao/token {
    # 允许的请求方法
    if ($request_method !~ ^(GET|OPTIONS)$) {
        return 405;
    }

    # CORS 预检请求处理
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # 设置代理目标
    proxy_pass https://openspeech.bytedance.com/api/v1/sts/token;

    # 改为 POST 方法（豆包 API 要求）
    proxy_method POST;

    # 设置请求体（包含 APP_KEY）
    # ⚠️ 重要：请替换为你的实际凭证
    proxy_set_body '{"appid":"4145251174","duration":3600}';

    # 设置请求头
    proxy_set_header Content-Type "application/json";

    # 设置 Authorization（包含 ACCESS_KEY）
    # ⚠️ 重要：请替换为你的实际凭证
    proxy_set_header Authorization "Bearer; LpK1fJ6uG4frTjWqMiZZ7Jp8agvDeSAW";

    # 标准代理头
    proxy_set_header Host openspeech.bytedance.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSL 配置
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    # 超时配置
    proxy_connect_timeout 10s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    # 添加 CORS 头（允许浏览器访问）
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

    # 缓存控制（避免缓存敏感的 Token）
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    # 错误处理
    proxy_intercept_errors on;
    error_page 502 503 504 = @doubao_error;
}

# 错误处理
location @doubao_error {
    default_type application/json;
    add_header 'Access-Control-Allow-Origin' '*' always;
    return 502 '{"success":false,"error":"豆包 Token 服务暂时不可用"}';
}

