server {
    listen 8801;
    server_name 101.126.81.196;

    # ai伴侣 金华小巴 web
    location / {
        root /chekkk/code/live2d_jinhua_web/dist;
        index index.html;
        client_max_body_size 64M;

        # 支持 SPA 路由
        try_files $uri $uri/ /index.html;
    }

    # ==================== 豆包 API 转发配置 ====================

    # 豆包 Token API 转发（方案 2：转发到本地 Token 服务器）
    location /api/doubao/token {
        # 转发到本地 Token 服务器（推荐：凭证保存在服务器端，更安全）
        proxy_pass http://localhost:3001/token;

        # 代理请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 配置（允许前端跨域访问）
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        add_header 'Access-Control-Max-Age' 1728000 always;

        # 处理 OPTIONS 预检请求
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # 超时配置
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 日志
        access_log /var/log/nginx/doubao_token_access.log;
        error_log /var/log/nginx/doubao_token_error.log;
    }

    # 豆包 WebSocket API 转发（用于语音识别）
    location /api/doubao/ws {
        # 转发到豆包 WebSocket API
        proxy_pass https://openspeech.bytedance.com;

        # WebSocket 升级配置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 代理请求头
        proxy_set_header Host openspeech.bytedance.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 保留原始请求头和查询参数
        proxy_pass_request_headers on;

        # WebSocket 超时配置（长连接）
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # 禁用缓冲（WebSocket 需要）
        proxy_buffering off;

        # 日志
        access_log /var/log/nginx/doubao_ws_access.log;
        error_log /var/log/nginx/doubao_ws_error.log;
    }

    # ==================== 健康检查 ====================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# HTTPS 配置（如果需要）
server {
    listen 443 ssl http2;
    server_name avatar.chekkk.com;

    # SSL 证书配置
    ssl_certificate /path/to/ssl/cert.pem;
    ssl_certificate_key /path/to/ssl/key.pem;

    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ai伴侣 金华小巴 web
